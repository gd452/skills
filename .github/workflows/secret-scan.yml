name: Secret Scan

# Public repo 의 마지막 방어선 — publish_skills.sh 우회한 직접 push 도 잡음.
# 발견 시 CI 빨간불 → merge 차단.
#
# 검사 범위: 보편 토큰 패턴만 (provider-agnostic).
# (사내 private repo 이름 deny list 같은 환경 의존적 리스트는
#  source repo 의 publish 게이트에서 처리 — 여기 적으면 그 자체가 leak)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for token-shaped secrets
        run: |
          set -e
          # 보편 토큰 패턴 — 어느 사용자든 leak 시 위험
          declare -a PATTERNS=(
            'sk-[A-Za-z0-9]{20,}'                        # OpenAI API
            'ghp_[A-Za-z0-9]{30,}'                       # GitHub PAT
            'gho_[A-Za-z0-9]{30,}'                       # GitHub OAuth
            'AIza[A-Za-z0-9_-]{35}'                      # Google API
            'sk-ant-[A-Za-z0-9_-]{30,}'                  # Anthropic
            'xox[bp]-[0-9]+-[A-Za-z0-9-]+'               # Slack bot/user
            'hooks\.slack\.com/services/T[A-Za-z0-9/]+'  # Slack webhook
            '\b[0-9]{8,12}:[A-Za-z0-9_-]{30,}\b'         # Telegram bot token
          )

          fail=0
          for pat in "${PATTERNS[@]}"; do
            # workflow 파일 자체는 검사 제외 (false positive 회피 — 패턴 자체가 매칭)
            if matches=$(grep -rEn "$pat" . \
                --include='*.md' --include='*.py' --include='*.sh' \
                --include='*.json' --include='*.toml' --include='*.txt' \
                --include='*.plist' \
                --exclude-dir=.git --exclude-dir=.github 2>/dev/null); then
              echo "🚫 SECRET pattern matched: $pat"
              echo "$matches"
              fail=1
            fi
          done

          if [ $fail -eq 0 ]; then
            echo "✅ 깨끗 — 토큰 패턴 노출 없음"
            exit 0
          else
            echo ""
            echo "❌ 위 항목 정리 후 push 재시도"
            exit 1
          fi
